<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="油费计算器">
<title>油费计算器</title>
<style>
:root { color-scheme: light; --blue:#1677ff; --ink:#172033; --muted:#6b7280; --line:#e5e7eb; --bg:#f3f6fb; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
main { max-width:520px; margin:0 auto; }
header { padding:28px 4px 18px; }
.kicker { color:var(--blue); font-weight:700; font-size:13px; letter-spacing:.04em; }
h1 { font-size:29px; margin:7px 0 5px; }
.subtitle { color:var(--muted); font-size:14px; }
.panel { background:#fff; border-radius:22px; padding:20px; box-shadow:0 8px 28px rgba(23,32,51,.06); margin-bottom:14px; }
label { display:block; font-size:14px; font-weight:650; margin:0 0 8px; }
.field { margin-bottom:18px; }
.field:last-child { margin-bottom:0; }
.input-wrap { display:flex; align-items:center; border:1px solid #d9dee8; border-radius:13px; padding:0 13px; background:#fff; }
.input-wrap:focus-within { border-color:var(--blue); box-shadow:0 0 0 3px rgba(22,119,255,.12); }
input { width:100%; min-width:0; border:0; outline:0; padding:14px 0; font:inherit; font-size:18px; color:var(--ink); background:transparent; }
.unit { color:var(--muted); font-size:13px; white-space:nowrap; padding-left:8px; }
.results { background:linear-gradient(145deg,#1267e8,#3994ff); color:#fff; border-radius:22px; padding:22px 20px; margin-bottom:14px; }
.result-label { color:rgba(255,255,255,.82); font-size:14px; }
.total { font-size:42px; font-weight:800; letter-spacing:-.04em; margin:5px 0 20px; overflow-wrap:anywhere; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat { background:rgba(255,255,255,.15); border-radius:14px; padding:13px; }
.stat span { display:block; color:rgba(255,255,255,.82); font-size:12px; margin-bottom:5px; }
.stat strong { font-size:18px; }
.note { font-size:12px; color:var(--muted); line-height:1.6; padding:0 4px; }
button { border:0; background:#edf4ff; color:#145fc4; padding:12px 14px; border-radius:12px; font:inherit; font-weight:650; width:100%; margin-top:14px; }
button:active { opacity:.75; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme:light; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">DRIVE · COST</div>
    <h1>油费计算器</h1>
    <div class="subtitle">输入油耗、路程和油价，自动估算本次燃油费用</div>
  </header>

  <section class="panel" aria-label="行程信息">
    <div class="field">
      <label for="consumption">平均油耗</label>
      <div class="input-wrap"><input id="consumption" type="number" inputmode="decimal" min="0" step="0.1" value="7.0" placeholder="例如 7.0"><span class="unit">L / 100 km</span></div>
    </div>
    <div class="field">
      <label for="distance">行驶路程</label>
      <div class="input-wrap"><input id="distance" type="number" inputmode="decimal" min="0" step="0.1" value="100" placeholder="例如 100"><span class="unit">km</span></div>
    </div>
    <div class="field">
      <label for="price">油价</label>
      <div class="input-wrap"><input id="price" type="number" inputmode="decimal" min="0" step="0.01" value="7.80" placeholder="例如 7.80"><span class="unit">元 / L</span></div>
    </div>
  </section>

  <section class="results" aria-live="polite">
    <div class="result-label">预计燃油费用</div>
    <div class="total" id="total">¥ 54.60</div>
    <div class="stats">
      <div class="stat"><span>预计耗油量</span><strong id="liters">7.00 L</strong></div>
      <div class="stat"><span>每公里油费</span><strong id="perKm">¥ 0.55</strong></div>
    </div>
  </section>

  <section class="panel">
    <div style="font-weight:700">计算公式</div>
    <p style="font-size:14px;line-height:1.7;color:#4b5563;margin:8px 0 0">耗油量 = 平均油耗 × 路程 ÷ 100<br>燃油费用 = 耗油量 × 每升油价</p>
    <button id="reset" type="button">恢复默认示例</button>
  </section>
  <p class="note">油价会保存在此浏览器的本地存储中，下次打开时自动带出上次油价。清除 Safari 网站数据或使用无痕浏览可能会清除保存内容。本计算器仅估算燃油费，不含过路费、停车费等。</p>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const consumption = $('consumption');
  const distance = $('distance');
  const price = $('price');
  const money = n => n.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
  const num = el => el.value.trim() === '' ? NaN : Number(el.value);

  try {
    const saved = localStorage.getItem('fuel-calculator-price-cny');
    if (saved !== null && saved !== '' && Number.isFinite(Number(saved)) && Number(saved) >= 0) price.value = saved;
  } catch (e) {}

  function calculate() {
    const c = num(consumption), d = num(distance), p = num(price);
    const valid = [c,d,p].every(Number.isFinite) && c >= 0 && d >= 0 && p >= 0;
    if (!valid) {
      $('total').textContent = '请输入有效数字';
      $('liters').textContent = '—';
      $('perKm').textContent = '—';
      return;
    }
    const liters = c * d / 100;
    $('total').textContent = '¥ ' + money(liters * p);
    $('liters').textContent = liters.toLocaleString('zh-CN', {maximumFractionDigits:2}) + ' L';
    $('perKm').textContent = '¥ ' + money(c * p / 100);
    try { localStorage.setItem('fuel-calculator-price-cny', String(p)); } catch (e) {}
  }
  [consumption, distance, price].forEach(el => el.addEventListener('input', calculate));
  $('reset').addEventListener('click', () => {
    consumption.value = '7.0';
    distance.value = '100';
    price.value = '7.80';
    calculate();
  });
  calculate();
})();
</script>
</body>
</html>
